# Experiment configuration — single source of truth for the benchmark.
# No scenario parameter may be hardcoded in Python; everything the pipeline
# needs to construct a run is defined here.

sample_rate: 16000
duration_s: 15.0

room:
  dimensions_m: [5.0, 4.0, 3.0]     # typical meeting room
  # Mic deliberately off-centre: no coordinate sits at a half-dimension of
  # the room, avoiding degenerate image-source symmetry.
  mic_position_m: [1.2, 1.7, 1.2]
  loudspeaker:
    # Placed at scenario-defined distance from the mic, along an azimuth
    # slightly off the +x axis (so the source is never exactly axis-aligned
    # with the mic), slightly below head height.
    azimuth_deg: 10.0
    height_m: 1.1
  near_talker:
    azimuth_deg: 110.0
    distance_m: 1.0
    height_m: 1.2
  min_wall_clearance_m: 0.5
  # Absorption is calibrated per RT60 level by bisection until the RT60
  # measured on h_echo (Schroeder backward integration) at the reference
  # distance is within tolerance of the target; inverse_sabine provides the
  # initial value only. The same calibrated absorption is then used across
  # all distance levels of that RT60 row.
  rt60_calibration:
    reference_distance_m: 1.0
    tolerance_pct: 3.0

speech:
  dataset_dir: data/speech/LibriSpeech/test-clean
  n_seeds: 3
  # Seeds the reproducible draw of disjoint (far, near) speaker pairs and the
  # per-speaker utterance ordering. Recorded file IDs land in each run's
  # metadata.
  speaker_selection_seed: 20250817

levels:
  # Simplified active-level measure (energy-gated RMS, not ITU-T P.56):
  # frames whose RMS is more than active_gate_threshold_db below the peak
  # frame RMS are treated as inactive.
  active_level_dbov: -26.0
  active_gate_frame_ms: 20.0
  active_gate_threshold_db: 40.0
  # One float->int16 scaling constant per run, shared by every system in the
  # run, chosen so max(|x|, |d|) sits this far below full scale.
  int16_headroom_db: 6.0

# Talk-state timelines: active intervals in seconds for each source.
# double keeps a far-only lead-in (adaptation), a double-talk region, and a
# far-only tail so steady-state statistics are measured post-double-talk.
timelines:
  far_single:
    far: [[0.0, 15.0]]
    near: []
  double:
    far: [[0.0, 15.0]]
    near: [[4.0, 11.0]]
  near_single:
    far: []
    near: [[0.0, 15.0]]

noise:
  # Speech-shaped noise is white noise filtered to the long-term average
  # spectrum of the selected LibriSpeech material for the run.
  spectrum_nperseg: 1024
  filter_taps: 513

# Three-state segmentation (far-active / near-active / neither), computed on
# the ground-truth component signals (d_echo and s) independently, never on
# the mixture. A frame is active when its mean power exceeds the absolute
# threshold; activity is held for the hangover duration after the last
# active frame to bridge inter-word pauses.
segmentation:
  frame_ms: 20.0
  energy_threshold_dbov: -45.0
  hangover_ms: 200.0

# Perceptual audibility of residual echo (spec §8.7). Simplified
# simultaneous-masking model, implemented in src/psychoacoustic.py — not an
# existing PEAQ/psychoacoustics package: the analysis asks a *relative*
# question (which system's residual is more audible under the same masker),
# and a fixed-offset simplified model biases all systems identically, so
# comparative conclusions survive the simplification. Every model constant
# lives here, not in code.
audibility:
  stft_nperseg: 512                # 32 ms Hann analysis window
  stft_hop: 320                    # = one 20 ms segmentation frame -> STFT
                                   #   frames map 1:1 onto ERLE-valid frames
  stft_window: hann
  # Hz->Bark: Zwicker–Terhardt arctan approximation
  #   z(f) = a*arctan(b*f) + c*arctan((f/d)^2)
  bark_a: 13.0
  bark_b: 0.00076
  bark_c: 3.5
  bark_d_hz: 7500.0
  # Two-slope spreading function, attenuation per Bark of separation from
  # the masker band (masking spreads more readily toward higher bands, so
  # the upward slope is the shallower one). Applied as a linear-domain
  # excitation sum over bands.
  spreading_lower_db_per_bark: 27.0   # toward lower bands
  spreading_upper_db_per_bark: 10.0   # toward higher bands
  masking_offset_db: 14.0          # threshold = spread masker power - offset
  # Absolute floor for the threshold, in dB re full-scale^2 band power.
  # This is the absolute-threshold-of-hearing proxy: in no-noise far-single
  # cells the masker is silence, and without a floor those cells would
  # report ~100% audibility by construction. A constant, not a
  # physiological curve — fixed across systems, so relative comparisons
  # are unaffected.
  threshold_floor_db: -65.0
  # Between coefficient snapshots (record_every samples apart) the
  # reconstruction holds the block-START state — the convention that is
  # causally exact when record_every=1, which is how it is unit-tested.
  # Linear interpolation between snapshots is computed as a secondary
  # column for the float path only (interpolating int16 states is not Q15
  # arithmetic).
  reconstruction: hold

metrics:
  erle_ema_alpha: 0.9              # smoothed = a*prev + (1-a)*new, valid frames only
  steady_state_last_fraction: 0.3  # steady state = median of final 30% of valid frames
  convergence_fraction: 0.9        # ERLE first reaching this fraction of steady state
  erle_sanity_max_db: 60.0         # steady state above this => reference signal wrong
  lsd_floor_db: -120.0             # spectral floor for log-spectral distance

systems:
  none: {}                  # explicit int16 round-trip at the run's scale
  speex:
    frame_size: 160         # 10 ms at 16 kHz; every tail length divides it
    filter_length_ms: 200.0
  nlms_f64:
    filter_length_ms: 200.0
    mu: 0.5
    delta: 1.0e-6
    record_every: 160    # coefficient-trajectory snapshot interval (samples)
  nlms_q15:
    # Q15 fixed-point NLMS (aec_nlms_fixed.py). mu/delta are stated in the
    # same real-valued units as nlms_f64; the runner converts them to Q15/Q30
    # integers (mu_q15 = round(mu * 2^15), delta_q30 = round(delta * 2^30))
    # and records both in the run row. coeff_bits=15 is full Q15 precision;
    # the word-length sweep overrides it per level.
    filter_length_ms: 200.0
    mu: 0.5
    delta: 1.0e-6
    record_every: 160
    coeff_bits: 15

scenario_defaults: &defaults
  rt60_s: 0.4
  speaker_mic_distance_m: 1.0
  talk: far_single
  noise_type: none          # none | speech_shaped | white
  snr_db: null
  ser_db: 0.0               # near-end over echo, measured on the overlap

scenarios:
  baseline:
    <<: *defaults

# ---------------------------------------------------------------------------
# Batch experiment matrix. Two-stage design, deliberately not a full
# factorial. Every (scenario, seed, system) triple becomes one row in
# results/raw/runs.csv.
# ---------------------------------------------------------------------------
batch:
  stage_a:
    # Main effects: 2-factor full cross, far single-talk, no noise.
    systems: [none, nlms_f64, speex, nlms_q15]
    rt60_levels_s: [0.2, 0.4, 0.6, 0.8]
    distance_levels_m: [0.3, 1.0, 2.5]
    scenario:
      talk: far_single
      noise_type: none
      snr_db: null
      ser_db: 0.0

  stage_b:
    # One factor at a time around the baseline (scenario_defaults above).
    talk:
      systems: [none, nlms_f64, speex, nlms_q15]
      levels: [far_single, double, near_single]
    noise:
      systems: [none, nlms_f64, speex, nlms_q15]
      levels:
        - {noise_type: none, snr_db: null}
        - {noise_type: speech_shaped, snr_db: 20.0}
        - {noise_type: speech_shaped, snr_db: 10.0}
    tail_length:
      # System parameter sweep (filter_length), all adaptive systems.
      systems: [nlms_f64, speex, nlms_q15]
      levels_ms: [50.0, 100.0, 200.0, 400.0]
    mu:
      # nlms_f64 only — speex has no step size. Speex runs once at its
      # baseline configuration as a clearly-labelled reference, not as a
      # swept system.
      systems: [nlms_f64]
      reference_systems: [speex]
      levels: [0.1, 0.3, 0.5, 0.9]
    word_length:
      # Effective coefficient word length via low-bit masking (nlms_q15
      # only; 15 = unmasked full Q15). The project's headline figure.
      systems: [nlms_q15]
      bits: [15, 11, 9, 7]
